name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One draft before the builds: three parallel electron-builder runs would each create their own.
  draft:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - run: gh release view "$TAG" || gh release create "$TAG" --draft --verify-tag --title "Glimpse ${TAG#v}" --notes ""
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}

  build:
    name: ${{ matrix.name }}
    needs: draft
    if: ${{ !cancelled() && needs.draft.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest }
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: End-to-end tests
        if: runner.os == 'Linux'
        # Electron downloads its binary on first use; the second launch then runs with
        # Chromium's sandbox, which needs a setuid-root helper.
        run: |
          npx install-electron
          sudo chown root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          xvfb-run -a npx playwright test
      - name: Build and publish installers
        # bash: PowerShell splits "-c.publish.repo=..." into a file path on Windows.
        shell: bash
        run: npx electron-builder --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }} -c.extraMetadata.homepage=https://github.com/${{ github.repository }} -c.publish.owner=${{ github.repository_owner }} -c.publish.repo=${{ github.event.repository.name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: glimpse-${{ matrix.name }}
          path: |
            dist/*.AppImage
            dist/*.exe
            dist/*.dmg
